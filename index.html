<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Advanced Password Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h2>Password Generator 🔐</h2>

  <div class="password-box">
    <input type="password" id="password" readonly>
    <span id="toggleEye">👁️</span>
    <button id="copyBtn">Copy</button>
  </div>

  <!-- Popup -->
  <div id="popup">Copied! ✅</div>

  <!-- Strength -->
  <div class="strength">
    <div id="strength-bar"></div>
  </div>
  <p id="strength-text"></p>

  <!-- Options -->
  <div class="options">
    <label>Password Length:</label>
    <input type="number" id="length" value="10" min="4" max="20">

    <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
    <label><input type="checkbox" id="lowercase" checked> Lowercase</label>
    <label><input type="checkbox" id="numbers" checked> Numbers</label>
    <label><input type="checkbox" id="symbols" checked> Symbols</label>
  </div>

  <button onclick="generatePassword()">Generate Password</button>

  <!-- History -->
  <div class="history">
    <h3>History (click to copy)</h3>
    <ul id="historyList"></ul>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
